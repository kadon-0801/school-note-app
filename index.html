<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>学習ノートアプリ</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <section id="homeScreen" class="home-screen">
    <header class="home-header">
      <div>
        <p class="home-eyebrow">学習ノート</p>
        <h1>ノート一覧</h1>
      </div>
    </header>
    <p id="homeStatus" class="home-status" aria-live="polite"></p>
    <div class="home-carousel">
      <button id="prevHomePageBtn" class="home-page-btn" type="button" aria-label="前のノート一覧">◀</button>
      <div id="noteList" class="note-list" aria-live="polite"></div>
      <button id="nextHomePageBtn" class="home-page-btn" type="button" aria-label="次のノート一覧">▶</button>
    </div>
  </section>

  <div id="editorScreen" class="app-shell" hidden>
    <aside class="left-menu">
      <div class="tool-bar">
        <div class="tool-panel tool-select-panel">
          <p class="tool-panel-title">ツール選択</p>
          <div class="tool-buttons">
            <button class="tool-btn active" data-tool="mouse">マウス</button>
            <button class="tool-btn" data-tool="pen">ペン</button>
            <button class="tool-btn" data-tool="aiText">AI文字</button>
            <button class="tool-btn" data-tool="marker">マーカー</button>
            <button class="tool-btn" data-tool="line">直線</button>
            <button class="tool-btn" data-tool="eraser">消しゴム</button>
            <button class="tool-btn" data-tool="text">テキスト</button>
            <button class="tool-btn" data-tool="template">定型文</button>
            <button class="tool-btn" data-tool="shape">図形</button>
            <button class="tool-btn" data-tool="image">画像</button>
          </div>
        </div>

        <div class="tool-panel tool-detail-panel">
          <p class="tool-panel-title">詳細設定</p>
          <div class="tool-controls">
            <div class="color-picker detail-control" data-tools="pen aiText marker line text template shape">
              <div class="color-picker-row">
                <canvas id="colorPlane" class="color-plane" width="150" height="112"></canvas>
                <canvas id="lightBar" class="light-bar" width="20" height="112"></canvas>
              </div>
              <input id="hue" type="hidden" value="220" />
              <input id="sat" type="hidden" value="70" />
              <input id="light" type="hidden" value="40" />
            </div>
            <label class="detail-control" data-tools="pen aiText marker line eraser text template shape">太さ
              <input id="size" type="range" min="1" max="40" value="4" />
            </label>
            <span id="colorPreview" class="color-preview detail-control" data-tools="pen aiText marker line text template shape"></span>

            <p id="aiTextStatus" class="ai-text-help detail-control" data-tools="aiText">書き終えると候補を表示します。</p>
            <section id="aiCandidatePanel" class="ai-candidate-panel detail-control" data-tools="aiText" aria-live="polite">
              <p class="ai-candidate-title">変換候補</p>
              <div id="aiCandidates" class="ai-candidates">
                <p class="ai-candidate-placeholder">手書きすると候補が表示されます。</p>
              </div>
            </section>

            <label class="detail-control" data-tools="text">文字
              <textarea id="textInput" class="text-input" rows="4" placeholder="ここに文字を入力"></textarea>
            </label>

            <label class="detail-control" data-tools="template">定型文
              <select id="templateSelect">
                <option>めあて</option>
                <option>まとめ</option>
                <option>予想</option>
                <option>振り返り</option>
                <option>ポイント</option>
                <option>重要</option>
                <option>実験</option>
                <option>考察</option>
                <option>結論</option>
                <option>問題</option>
                <option>メモ</option>
              </select>
            </label>

            <label class="detail-control" data-tools="shape">図形
              <select id="shapeSelect">
                <option value="circle">丸</option>
                <option value="triangle">三角</option>
                <option value="square">四角</option>
                <option value="pentagon">五角形</option>
                <option value="hexagon">六角形</option>
              </select>
            </label>

            <label class="file-label inline detail-control" data-tools="image">
              画像選択
              <input id="imageInput" type="file" accept="image/*" />
            </label>
            <img id="imagePreview" class="image-preview detail-control" data-tools="image" alt="選択した画像のプレビュー" />

            <div class="mouse-detail detail-control" data-tools="mouse">
              <p id="selectedObjectInfo" class="selected-object-info">未選択</p>
              <button id="deleteSelectedBtn">選択中を削除</button>
              <button id="clearPageBtn">全消去</button>
              <button id="undoBtn">1手順前に戻る</button>
              <button id="redoBtn">1手順先に進む</button>
            </div>
          </div>
        </div>
      </div>
    </aside>

    <main class="main-area top-collapsed" id="mainArea">
      <button id="goHomeBtn" class="go-home-btn" type="button">ホーム</button>
      <header class="top-bar">
        <div class="meta-row">
          <label>教科
            <select id="subjectSelect">
              <option value="国語">国語</option>
              <option value="社会">社会</option>
              <option value="数学">数学</option>
              <option value="理科">理科</option>
              <option value="音楽">音楽</option>
              <option value="美術">美術</option>
              <option value="技術">技術</option>
              <option value="家庭">家庭</option>
              <option value="英語">英語</option>
              <option value="その他">その他</option>
            </select>
          </label>
          <input id="subjectOther" type="text" placeholder="教科を入力" />
          <label>日付
            <input id="noteDate" type="date" />
          </label>
          <label class="title-grow">ノート名
            <input id="noteTitle" type="text" value="ノート" />
          </label>
        </div>
      </header>

      <button id="topMenuToggle" class="top-menu-toggle" type="button" aria-label="上部メニューを表示">
        <span class="triangle"></span>
      </button>

      <section class="canvas-wrap">
        <div class="canvas-stage">
          <canvas id="noteCanvas" width="1430" height="1000"></canvas>
        </div>
      </section>

      <footer class="bottom-menu">
      <div class="menu-section">
        <label id="selectedTextEditor" class="selected-text-editor" hidden>選択中の文字
          <textarea id="selectedTextInput" class="text-input" rows="3" placeholder="文字を編集"></textarea>
        </label>
        <button id="savePdfBtn">PDFとして保存</button>
        <button id="saveDataBtn">ノートを保存</button>
        <button id="resetNoteBtn">リセット（白紙に戻す）</button>
        <label class="file-label">
          ノートを読み込む
          <input id="loadDataInput" type="file" accept="application/json" />
        </label>
      </div>

      <div class="menu-section">
        <p class="menu-title">ページ管理</p>
        <div class="row">
          <button id="prevPageBtn">前へ</button>
          <span id="pageIndicator">1 / 1</span>
          <button id="nextPageBtn">次へ</button>
        </div>
        <div class="row">
          <button id="addPageBtn">ページ追加</button>
          <button id="removePageBtn">ページ削除</button>
        </div>
      </div>

      <div class="menu-section">
        <p class="menu-title">ノート背景</p>
        <select id="backgroundType">
          <option value="plain" selected>白紙</option>
          <option value="fourLine">4線（英語）</option>
          <option value="vertical5mm">縦線</option>
          <option value="grid5mm">5mm方眼</option>
        </select>
      </div>

      </footer>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
